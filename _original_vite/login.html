<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalkinDev | Admin Login</title>
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div id="login-page">
      <div class="login-container">
        <div class="login-logo">
          <a href="/">
            <img src="/images/logo-icon.png" alt="CalkinDev Logo" />
          </a>
        </div>
        <h1>Admin Login</h1>
        <p class="login-subtitle">Dashboard coming soon</p>
        <form class="login-form" onsubmit="return false;">
          <div class="login-field">
            <label>Email</label>
            <input type="email" placeholder="admin@calkindev.nz" disabled />
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" placeholder="********" disabled />
          </div>
          <button type="submit" disabled>Sign In</button>
        </form>
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
      </div>
    </div>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
