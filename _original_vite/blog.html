<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | CalkinDev</title>
    <meta name="description" content="Notes on what I'm building and learning — CalkinDev's blog." />
    <link rel="icon" type="image/png" href="/images/logo-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item logo" href="/">
            <img src="/images/logo-icon.png" alt="CalkinDev" class="nav-logo-img" />
            <span class="logo-text"><span class="logo-calkin">Calkin</span><span class="logo-dev">Dev</span></span>
          </a>
          <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </a>
        </div>
        <div id="navMenu" class="navbar-menu">
          <div class="navbar-end">
            <a class="navbar-item nav-link" href="/#about">About</a>
            <a class="navbar-item nav-link" href="/#projects">Projects</a>
            <a class="navbar-item nav-link" href="/#contact">Contact</a>
            <div class="navbar-item">
              <button id="theme-toggle" class="button is-small theme-btn" aria-label="Toggle dark mode">
                <span class="icon"><i class="fas fa-moon"></i></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <section class="section blog-index-section">
      <div class="container blog-index-container">
        <h1 class="title is-2 section-title">Blog</h1>
        <p class="subtitle is-5 has-text-grey">Notes on what I'm building and learning</p>
        <div id="post-list" class="post-list">
          <!-- Posts injected from /blog/posts.json -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer site-footer">
      <div class="content has-text-centered">
        <p class="footer-links">
          <a href="/#about">About</a> · <a href="/#projects">Projects</a> ·
          <a href="/#contact">Contact</a>
        </p>
        <p class="has-text-grey">&copy; 2026 CalkinDev. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="/src/blog.ts"></script>
  </body>
</html>
